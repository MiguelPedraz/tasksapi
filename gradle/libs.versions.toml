# Version Catalog - Always Updated to Latest Stable Versions
# Last updated: February 2026
# https://docs.gradle.org/current/userguide/platforms.html#sub::toml-dependencies-format

[versions]
# Spring Framework - Latest LTS
spring-boot = "4.0.2"
spring-dependency-management = "1.1.7"

# Databases - Latest Stable
postgresql = "42.7.10"
h2 = "2.4.240"

# Testing - Latest Stable
junit-jupiter = "6.0.2"
mockito = "5.21.0"
testcontainers = "2.0.3"
rest-assured = "6.0.0"

# Documentation - Latest Stable
springdoc-openapi = "3.0.1"

# Observability - Latest Stable
micrometer = "1.16.3"

# Build Tools - Latest Stable
lombok = "1.18.42"

# Utilities
guava = "33.5.0-jre"

[libraries]
# Spring Boot Starters (managed by Spring Boot BOM)
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

# Databases
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "rest-assured" }

# Observability
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Documentation
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc-openapi" }

# Utilities
guava = { module = "com.google.guava:guava", version.ref = "guava" }

[bundles]
spring-boot-core = ["spring-boot-starter-web", "spring-boot-starter-data-jpa", "spring-boot-starter-validation"]
testing = ["junit-jupiter", "mockito-core", "mockito-junit-jupiter", "spring-boot-starter-test"]
testcontainers-full = ["testcontainers", "testcontainers-junit", "testcontainers-postgresql"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
versions = { id = "com.github.ben-manes.versions", version = "0.53.0" }
dependency-check = { id = "org.owasp.dependencycheck", version = "12.2.0" }
