name: Run Renovate (manual)

on:
  workflow_dispatch:

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.1
        env:
          # Override schedule so manual runs always execute regardless of configured schedule
          RENOVATE_FORCE: '{"schedule":[]}'
          # Enable debug logging to see exactly what versions Renovate evaluated per package
          LOG_LEVEL: debug
        with:
          # Crear un Personal Access Token con scope 'repo' en GitHub Settings → Developer settings → Personal access tokens
          # Añadir en Settings → Secrets and variables → Actions → New repository secret: RENOVATE_TOKEN
          token: ${{ secrets.RENOVATE_TOKEN }}
          configurationFile: renovate.json
