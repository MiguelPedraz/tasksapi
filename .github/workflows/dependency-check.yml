name: Dependency Updates Check

on:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 3 AM UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  check-updates:
    name: Check for Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Check for dependency updates
        run: ./gradlew dependencyUpdates
      
      - name: Upload dependency updates report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-updates-report
          path: app/build/dependencyUpdates/report.html
          retention-days: 30
      
      - name: Check for security vulnerabilities
        run: ./gradlew dependencyCheckAnalyze
        continue-on-error: true
      
      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: app/build/reports/dependency-check-report.html
          retention-days: 30
      
      - name: Comment on commit with results
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'app/build/dependencyUpdates/report.txt';
            
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🔄 Weekly Dependency Updates Available',
                body: `## Dependency Updates Report\n\nGenerated: ${new Date().toISOString()}\n\n` +
                      `Download the full HTML report from the Actions artifacts.\n\n` +
                      `### Quick Summary\n\n` +
                      `Check the [dependency updates report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
                labels: ['dependencies', 'maintenance', 'automated']
              });
            }
